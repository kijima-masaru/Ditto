name: Release

on:
  workflow_dispatch:            # 手動起動（私からも起動を試せます）
    inputs:
      release_type:
        description: 'release=即公開 / draft=下書きのみ'
        default: release
        type: choice
        options: [release, draft]
  push:
    branches: ['release/**']    # 私が確実に起動できる経路

permissions:
  contents: write               # リリース作成に必須

concurrency:                    # 同時実行による二重リリースを防ぐ
  group: release

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # ビルドのみ行い、公開はelectron-builderに任せない。
      # electron-builderのGitHubパブリッシャーは、リリースが未作成の状態で複数の
      # アップロードが並行すると、それぞれが「リリースが存在しない」と判断して同時に
      # リリースを作成しにいく。競合に負けた側のアップロードは失われ、しかもジョブは
      # 成功扱いになるため、v1.27.40では.blockmapが欠けたまま公開されてしまった
      - run: npm run build:win -- --publish never

      # ビルド済みの成果物をghでまとめてアップロードする。リリース作成もタグ作成も
      # ここで行うため競合が起きない。アップロード後に3点が揃っているか検証し、
      # 欠けていればジョブを失敗させる(欠落を成功扱いで見逃さないため)
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          files=(
            "dist/Ditto-$version-setup.exe"
            "dist/Ditto-$version-setup.exe.blockmap"
            "dist/latest.yml"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "配布物が見つかりません: $f" >&2
              exit 1
            fi
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "リリース $tag は既に存在するため、アセットを上書きアップロードします"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            echo "リリース $tag を作成します"
            args=(--title "$version" --notes "自動リリース (commit: $GITHUB_SHA)" --target "$GITHUB_SHA")
            if [ "${RELEASE_TYPE:-release}" = "draft" ]; then
              args+=(--draft)
            fi
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi

          names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "公開アセット:"
          echo "$names"
          for f in "${files[@]}"; do
            base=$(basename "$f")
            if ! echo "$names" | grep -qx "$base"; then
              echo "アセットが公開されていません: $base" >&2
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4   # 公開に失敗してもインストーラを回収できるように
        if: always()
        with:
          name: Ditto-setup
          path: dist/*.exe
