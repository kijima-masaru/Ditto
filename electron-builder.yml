appId: com.flatline.autotesttool
productName: Ditto
directories:
  buildResources: build
# ネイティブ依存(active-win/uiohook-napi/koffi/@nut-tree-fork)はいずれもElectronの
# ABIでそのまま動くprebuildバイナリを使っており、node-gypでのリビルドは不要かつ
# このビルド環境にVisual Studio Build Toolsが無いため失敗する。無効化する。
npmRebuild: false
publish:
  provider: github
  owner: kijima-masaru
  repo: Ditto
  # 既定で公開リリースとして作成する(未指定だとdraftになり、公開に手作業が必要になる)。
  # 下書きにしたい場合はビルド時に環境変数 EP_DRAFT=true を指定する
  releaseType: release
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
