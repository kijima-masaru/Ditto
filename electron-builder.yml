appId: com.flatline.autotesttool
productName: 自動テストツール
directories:
  buildResources: build
publish:
  provider: github
  owner: kijima-masaru
  repo: auto-test-tool
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
