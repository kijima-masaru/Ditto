appId: com.flatline.autotesttool
productName: Ditto
directories:
  buildResources: build
# ネイティブ依存(active-win/uiohook-napi/koffi/@nut-tree-fork)はいずれもElectronの
# ABIでそのまま動くprebuildバイナリを使っており、node-gypでのリビルドは不要かつ
# このビルド環境にVisual Studio Build Toolsが無いため失敗する。無効化する。
npmRebuild: false
publish:
  provider: github
  owner: kijima-masaru
  repo: auto-test-tool
files:
  - out/**/*
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
asarUnpack:
  - resources/**
win:
  target: nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
